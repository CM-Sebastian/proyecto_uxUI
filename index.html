<script>
    document.querySelectorAll('.favorito').forEach(boton => {
        boton.addEventListener('click', function() {
            if (this.innerText === '♡') {
                this.innerText = '♥';
                this.style.color = '#e91e63'; 
            } else {
                this.innerText = '♡';
                this.style.color = 'black'; 
            }
        });
    });
</script>
