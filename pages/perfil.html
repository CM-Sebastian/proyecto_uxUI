<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Subscriptions - Mi Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <a href="inicio.html">
                <img src="../images/u-subs-logo 1.png" alt="U-Subscriptions Logo" class="nav-logo">
            </a>
        </div>

        <nav class="icon-nav">
            <a href="#" class="nav-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <span>Convenios</span>
            </a>

            <a href="#" class="nav-item">
                <div class="icon-wrapper">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <span>Notificaciones</span>
            </a>

            <a href="#" class="nav-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span>Ahorro</span>
            </a>

            <a href="pagos.html" class="nav-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <span>Pagos</span>
            </a>

            <!-- PÁGINA ACTIVA (Perfil) -->
            <a href="perfil.html" class="nav-item active">
                <div class="icon-wrapper">
                    <i class="fa-regular fa-user"></i>
                </div>
                <span>Perfil</span>
            </a>
        </nav>
    </header>

    <div class="title-banner-wrapper">
        <h1 class="page-title-banner">Perfil de usuario</h1>
    </div>

    <main class="profile-card">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img src="../images/Generic avatar.png" alt="Foto de Perfil" class="profile-avatar">
                <button class="btn-edit-avatar" title="Cambiar foto">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <h2 class="user-name">Usuario Institucional</h2>
            <p class="user-role">Estudiante Universitario</p>
        </div>

        <!-- Formulario de Datos del Usuario -->
        <form class="profile-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Anthony Uribe">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Institucional</label>
                    <input type="email" id="correo" placeholder="estudiante@puce.edu.ec">
                </div>

                <div class="form-group">
                    <label for="universidad">Universidad / Institución</label>
                    <input type="text" id="universidad" placeholder="PUCE">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono de contacto</label>
                    <input type="text" id="telefono" placeholder="Añadir número...">
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="profile-actions">
                <button type="button" class="btn-profile btn-secondary">Editar Datos</button>
                <button type="submit" class="btn-profile btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </main>

</body>
</html>
