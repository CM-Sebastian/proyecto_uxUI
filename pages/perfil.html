<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | U-Subscriptions</title>
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <!-- Encabezado / Barra de navegación -->
    <header>
        <div class="logo">
            <img src="../images/u-subs-logo 1.png" alt="Logo de U-Subscriptions">
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="#">Convenios</a></li>
                <li><a href="#">Notificaciones</a></li>
                <li><a href="#">Ahorro</a></li>
                <li><a href="#">Pagos</a></li>
                <li><a href="#">Perfil</a></li>
            </ul>
        </nav>
    </header>

    <main class="perfil-page">
        <h1 class="page-title">Perfil</h1>

        <section class="perfil-section">
            <article class="perfil-card">
                <div class="section-title">Tu</div>
                <div class="profile-card">
                    <div class="profile-summary">
                        <div class="profile-avatar">
                            <img src="../images/Generic avatar.png" alt="Icono de usuario">
                        </div>
                        <div class="profile-info">
                            <p>Nombres Cuenta</p>
                        </div>
                        <div class="profile-status">Matriculado</div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Editar</button>
                    </div>
                </div>
            </article>

            <article class="perfil-card">
                <div class="section-title">Otras cuentas</div>
                <div class="profile-card">
                    <div class="profile-summary">
                        <div class="profile-avatar">
                            <img src="../images/Generic avatar.png" alt="Icono de usuario">
                        </div>
                        <div class="profile-info">
                            <p>Cuenta registrada</p>
                        </div>
                        <div class="profile-status">Matriculado</div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Editar</button>
                    </div>
                </div>
            </article>

            <article class="perfil-card">
                <div class="section-title">Métodos de pago</div>
                <div class="profile-card">
                    <div class="payment-grid">
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Configurar</button>
                        <button class="button-secondary" type="button">Ver más</button>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
