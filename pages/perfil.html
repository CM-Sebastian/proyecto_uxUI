<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | U-Subscriptions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <!-- Encabezado / Barra de navegación -->
    <header>
        <div class="logo">
            <img src="../images/u-subs-logo 1.png" alt="Logo de U-Subscriptions">
        </div>
        <nav aria-label="Navegación principal">
            <ul>
                <li>
                <a href="buscar-convenios.html">
                    <img src="../images/iconos/icono-buscar.png" alt="Icono de convenios">
                    <span>Convenios</span>
                </a>
                </li>

                <li>
                <a href="panel_ahorro.html">
                    <img src="../images/iconos/icono-ahorro.png" alt="Icono de ahorros">
                    <span>Ahorros</span>
                </a>
                </li>
                <li>
                <a href="pagos.html">
                    <img src="../images/iconos/icono-pagos.png" alt="Icono de pagos">
                    <span>Pagos</span>
                </a>
                </li>
                <li>
                <a href="perfil.html">
                    <img src="../images/iconos/icono-perfil.png" alt="Icono de perfil">
                    <span>Perfil</span>
                </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="perfil-page">
        <h1>Perfil</h1>

        <section class="perfil-section">
            <article class="perfil-card">
                <h2>Tu</h2>
                <div class="profile-card">
                    <div class="profile-summary">
                        <div class="profile-avatar">
                            <img src="../images/Generic avatar.png" alt="Icono de usuario">
                        </div>
                        <div class="profile-info">
                            <p>Nombres Cuenta</p>
                        </div>
                        <div class="profile-status">Matriculado</div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Editar</button>
                    </div>
                </div>
            </article>

            <article class="perfil-card">
                <h2>Otras cuentas</h2>
                <div class="profile-card">
                    <div class="profile-summary">
                        <div class="profile-avatar">
                            <img src="../images/Generic avatar.png" alt="Icono de usuario">
                        </div>
                        <div class="profile-info">
                            <p>Cuenta registrada</p>
                        </div>
                        <div class="profile-status">Matriculado</div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Editar</button>
                    </div>
                </div>
            </article>

            <article class="perfil-card">
                <h2>Métodos de pago</h2>
                <div class="profile-card">
                    <div class="payment-grid">
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                        <div class="payment-item">
                            <img src="../images/banco-pichincha-logo-0.webp" alt="Banco Pichincha">
                            <p>Banco Pichincha</p>
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="button-primary" type="button">Configurar</button>
                        <button class="button-secondary" type="button">Ver más</button>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
