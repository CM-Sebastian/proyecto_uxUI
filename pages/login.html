<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-subscriptions</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo de U-Subscriptions">
        </div>
        <nav>
            <ul>
                <li>
                    <a href="#">
                        <img src="icono-buscar.png" alt="">
                        <span>Convenios</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-notificaciones.png" alt="">
                        <span>Notificaciones</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-ahorro.png" alt="">
                        <span>Ahorros</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-pagos.png" alt="">
                        <span>Pagos</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-perfil.png" alt="">
                        <span>Perfil</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="">
            <h1>Registrarse</h1>
            <h2>Sus Datos</h2>
            <form>
                <div>
                    <label for="input-username">Su Usuario</label>
                    <input type="text" id="input-username"
                    name="fullName" autocomplete="name" required>
                </div>
                <div>
                    <label for="input-email">Su Correo electrónico</label>
                    <input type="email" id="input-email" name="email"
                    autocomplete="email" required>
                </div>
                <div>
                    <label for="input-password">Su Contraseña</label>
                    <input type="password" id="input-password"
                    name="fullName" autocomplete="off" required>
                </div>
                <button type="submit">Crear cuenta</button>
                <span>Ya tiene un cuenta?</span>
                <a href="">Iniciar sesion</a>
            </form>   

        </section>


    </main>
 
</body>
</html>
